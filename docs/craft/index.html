<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141029">
<title>마비노기 제작 재료 계산기 v0.3 test</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--card:rgba(255,255,255,.05);--line:rgba(247,217,139,.25);--gold:#f7d98b;--tx:#ece8ff;--mu:#a9a2d6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0b0918 radial-gradient(circle at 50% 0%,#2b2357 0%,#141029 55%,#0b0918 100%) no-repeat fixed;color:var(--tx);padding:18px 14px}
.wrap{max-width:1240px;margin:0 auto}
.siteNav{display:flex;align-items:center;gap:2px;margin:0 0 10px;font-size:12.5px}.siteNav a{color:#a9a2d4;text-decoration:none;padding:3px 10px;border-radius:999px}.siteNav a:hover{color:#ffe7a3}
.head{margin:10px 0 18px}.head h1{font-size:30px;font-weight:800;background:linear-gradient(90deg,#f7d98b,#fff3cf,#f7d98b);-webkit-background-clip:text;background-clip:text;color:transparent}
.verBadge{font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;font-weight:500;-webkit-text-fill-color:var(--mu)}
.head p{margin-top:6px;color:var(--mu);font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{font:inherit;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(247,217,139,.35);color:#f3eefe}.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=number]{background:#120e28;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
input[type=number]{width:72px}
.totals{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-size:13px;margin-bottom:10px}.totals b{color:var(--gold)}
.cond{font-size:12.5px;color:var(--mu);margin-bottom:22px}.cond b{color:var(--gold)}
.scroll{overflow-x:auto;padding-bottom:10px;width:calc(100vw - 28px);position:relative;left:50%;transform:translateX(-50%)}
.tree{display:inline-block;min-width:100%;text-align:center}
.tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:18px 0 0;position:relative}
#root>ul{padding-top:0}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:18px 2px 0;min-width:0}
#root>ul>li{padding-top:0}
.tree li:before,.tree li:after{content:"";position:absolute;top:0;width:50%;border-top:1px solid #c9a24a99}
.tree li:before{right:50%}.tree li:after{left:50%;border-left:1px solid #c9a24a99;height:18px}
.tree li:first-child:before,.tree li:last-child:after{border:0}
.tree li:last-child:before{border-right:1px solid #c9a24a99;height:18px}
.tree li:only-child:before{border:0}.tree li:only-child:after{border-top:0;left:50%}
#root>ul>li:before,#root>ul>li:after{display:none}
.tree ul ul:before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1px solid #c9a24a99}
.bal{display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:#16213a;border:1px solid #c9a24a66;border-radius:8px;padding:6px 9px;white-space:nowrap;font-size:13px}
.tree ul ul .bal{padding:4px 6px;font-size:12px;max-width:118px;white-space:normal;text-align:center}.tree ul ul .bal .t{flex-wrap:wrap;justify-content:center;gap:3px}.tree ul ul .q{white-space:nowrap}
.bal.craft{cursor:pointer}.bal.craft:hover{border-color:#e8c66a}
.bal .t{display:flex;align-items:center;gap:5px}.bal b{font-weight:600}
.bal.goal{background:#2a2410;border-color:#e8c66a;padding:8px 14px}.bal.goal b{font-size:14px;color:#e8c66a}
.tag{font-size:10px;border:1px solid;border-radius:4px;padding:0 4px}
.ic{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-size:11px}
.chev{color:#e8c66a99;font-size:10px}
.q{font-size:12px;font-variant-numeric:tabular-nums;color:#8a96b3;display:flex;align-items:center;gap:3px}.q em{font-style:normal;color:#ff8a7a;font-weight:700}.q.ok em{color:#7fd99a}
.q input[type=number]{width:46px;padding:0 3px;font-size:11px;border-radius:4px}
.need0{color:#6fd39b!important}.hint{font-size:11px;color:#7d75b0;margin-top:4px}
.siteFoot{margin:28px auto 18px;padding:22px 16px 28px;max-width:1180px;text-align:center;font-size:12.5px;line-height:1.65;color:#8a90a0;position:relative;border-top:1px solid #232733}.siteFoot .gold{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg,transparent,#f7d98b,transparent)}.siteFoot a{color:#c9b27a;text-decoration:none}.siteFoot a:hover{color:#f7d98b;text-decoration:underline}
.siteFoot a{color:inherit;text-decoration:none}.siteFoot a:hover{text-decoration:underline}#root{display:flex;flex-direction:column;align-items:flex-start}
#root>.row:first-child{align-self:center}
.row{display:flex;gap:6px;position:relative;padding-top:22px;width:max-content}.row:first-child{padding-top:0}
.row:before{content:"";position:absolute;top:0;left:var(--px,50%);height:22px;border-left:1px solid #c9a24a99}.row:first-child:before{display:none}
.row .bal.open{outline:2px solid #e8c66a;box-shadow:0 4px 12px #e8c66a33}
.row.drop{padding-top:14px}.row.drop:before{height:14px;border-left-style:dashed}
.row{transition:opacity .2s,transform .2s}.row.out{opacity:0;transform:translateY(-10px)}
.bal.ph{visibility:visible!important;opacity:.28;filter:grayscale(1);background:transparent!important;border:1px solid #c9a24a88!important;pointer-events:none;box-shadow:none!important;outline:0!important;cursor:default}
.bal.press{transform:scale(.95);transition:transform .1s;box-shadow:0 0 0 3px #e8c66a55}
.row:before{top:-1px;height:23px}.row.drop{padding-top:12px}.row.drop:before{top:-1px;height:13px;border-left:2px solid #e8c66a}.row.drop+.row:before{border-left:2px solid #e8c66a}
.row.drop+.row{padding-top:22px}
.row:not(.drop):before{display:none}.row .ln{position:absolute;border-left:1px solid #c9a24acc;border-top:1px solid #c9a24acc;pointer-events:none}.row.drop+.row .ln{border-color:#e8c66a}
</style>
