<!doctype html><meta charset=utf-8><title>전재산 합계 그래프 B</title><style>body{margin:0;background:#14161b;color:#e8e6df;font-family:Pretendard,"Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:24px}.tag{color:#8a90a0;font-size:13px}.foot{background:#1b1e26;border:1px solid #232733;border-radius:14px;padding:14px 18px;line-height:1.9;font-size:15px}.foot span,.wealth{color:#f7d98b;font-weight:800}.cost{color:#ff8a8a}.modal{margin-top:20px;background:#1b1e26;border:1px solid #2c3140;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0008}.modal h3{margin:0 0 10px;color:#f7d98b}.big{font-size:28px;font-weight:800;color:#f7d98b}.big small{font-size:13px;margin-left:8px}.tg{margin:12px 0}.tg button{background:none;border:1px solid #2c3140;color:#aab;border-radius:999px;padding:4px 12px;margin-right:6px}.tg .on{background:#f7d98b;color:#1b1636;border-color:#f7d98b;font-weight:700}.note{color:#8a90a0;font-size:12.5px}.whl{list-style:none;padding:0;margin:0}.whl li{display:flex;gap:12px;padding:8px 0;border-top:1px solid #232733;font-size:14px}.whl li span:first-child{color:#8a90a0;width:50px}.whl b{flex:1}.wn{color:#f7d98b;font-weight:800}.acts{text-align:right;margin-top:12px}.btn{border:0;border-radius:10px;padding:9px 18px;font-weight:800}.gold{background:linear-gradient(90deg,#f7d98b,#e9bf5c);color:#2a2040}.click{cursor:pointer;border-bottom:1px dashed #f7d98b80}.hint{display:inline-block;margin-left:6px;font-size:11px;color:#8a90a0}.spark{display:inline-block;vertical-align:middle;width:90px;height:26px;margin-left:8px;cursor:pointer}.gbtn{float:right;background:rgba(247,217,139,.12);border:1px solid rgba(247,217,139,.45);color:#ffe7a3;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}</style><div class=wrap><div class=tag>안 B · 푸터 미니 스파크라인 → 클릭 시 모달</div><h2 style="color:#f7d98b">B. 합계 옆 작은 그래프, 누르면 크게</h2><div class=foot><div>💰 전재산 합계 <span class="wealth" id=w></span><span class=spark id=sp></span><small style="color:#7fd69a;margin-left:6px">▲ 이번 달</small></div><div>💸 이번 주 지출 <span class=cost>1,240,000 G</span> · 순이익 <span>+3,180,000 G</span></div><div>⏳ 다음 리셋 <span>11/5 06:00</span></div></div><div id=m></div></div><script>var D=864e5,now=Date.parse('2026-10-28T20:00:00+09:00');
var chars=[{name:'루에리',wealth:48200000,wh:[]},{name:'나오',wealth:21750000,wh:[]},{name:'타르라크',wealth:9300000,wh:[]},{name:'부캐3',wealth:null,wh:[]}];
(function(){var seeds=[[31e6,[[-40,null],[-33,34e6],[-26,33.1e6],[-20,38e6],[-14,41.5e6],[-9,40.2e6],[-4,45e6],[-1,48.2e6]]],[12e6,[[-35,null],[-28,14e6],[-21,16.4e6],[-12,19e6],[-6,18.2e6],[-2,21.75e6]]],[0,[[-18,null],[-17,5e6],[-10,7.7e6],[-3,9.3e6]]]];
seeds.forEach(function(s,i){var prev=null;s[1].forEach(function(p,k){var n=k==0?s[0]:p[1];chars[i].wh.push({t:now+p[0]*D,o:k==0?null:prev,n:n});prev=n;});});})();
// reconstruct: value of char at time t = n of last entry<=t, else o of first entry (null if none)
function sumSeries(cs){var ts=[];cs.forEach(function(c){c.wh.forEach(function(e){ts.push(e.t)})});ts=ts.sort().filter(function(t,i,a){return a.indexOf(t)==i});
return ts.map(function(t){var s=0,any=false;cs.forEach(function(c){var v=null;if(!c.wh.length)v=c.wealth;else{for(var i=c.wh.length-1;i>=0;i--)if(c.wh[i].t<=t){v=c.wh[i].n;break}if(i<0)v=c.wh[0].o;}if(v!=null){s+=v;any=true}});return {t:t,v:any?s:null}}).filter(function(p){return p.v!=null});}
function fm(v){return v>=1e8?(v/1e8).toFixed(2).replace(/\.?0+$/,'')+'억':Math.round(v/1e4).toLocaleString()+'만'}
function md(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()}
function chart(el,pts,h,mini){var W=el.clientWidth||600,H=h,p=mini?2:28,xs=pts.map(function(q){return q.t}),vs=pts.map(function(q){return q.v});var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,vs)*.95,y1=Math.max.apply(0,vs)*1.03;
function X(t){return p+(t-x0)/(x1-x0)*(W-p*2)}function Y(v){return H-p-(v-y0)/(y1-y0)*(H-p*2)}
var line=pts.map(function(q,i){return (i?'L':'M')+X(q.t).toFixed(1)+' '+Y(q.v).toFixed(1)}).join(' ');var area=line+' L'+X(x1)+' '+(H-p)+' L'+X(x0)+' '+(H-p)+'Z';
var g='';if(!mini){for(var k=0;k<4;k++){var v=y0+(y1-y0)*k/3;g+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#232733"/><text x="'+(W-p)+'" y="'+(Y(v)-4)+'" fill="#6c7385" font-size="11" text-anchor="end">'+fm(v)+'</text>'}
[x0,(x0+x1)/2,x1].forEach(function(t){g+='<text x="'+X(t)+'" y="'+(H-8)+'" fill="#6c7385" font-size="11" text-anchor="middle">'+md(t)+'</text>'});
g+=pts.map(function(q){return '<circle cx="'+X(q.t)+'" cy="'+Y(q.v)+'" r="2.5" fill="#14161b" stroke="#f7d98b" stroke-width="1.5"/>'}).join('');}
var L=pts[pts.length-1];el.innerHTML='<svg width="'+W+'" height="'+H+'"><defs><linearGradient id="gg'+H+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d98b" stop-opacity=".28"/><stop offset="1" stop-color="#f7d98b" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#gg'+H+')"/><path d="'+line+'" fill="none" stroke="#f7d98b" stroke-width="2"/><circle cx="'+X(L.t)+'" cy="'+Y(L.v)+'" r="'+(mini?2.5:4.5)+'" fill="#f7d98b"/></svg>';}
var S=sumSeries(chars),last=S[S.length-1].v;
function deltas(){var h='';for(var i=S.length-1;i>0&&i>S.length-6;i--){var d=S[i].v-S[i-1].v;h+='<li><span>'+md(S[i].t)+'</span><b style="color:'+(d>=0?'#7fd69a':'#ff8a8a')+'">'+(d>=0?'+':'−')+fm(Math.abs(d))+'</b><span class="wn">'+fm(S[i].v)+'</span></li>'}return h}
function modal(){return '<div class="modal"><h3>💰 전재산 합계 내역</h3><div class="big">'+fm(last)+' G <small style="color:#7fd69a">▲ '+fm(last-S[0].v)+' (기록 시작 대비)</small></div><div class="tg"><button>1주</button><button class="on">1달</button><button>전체</button></div><div id="ch"></div><p class="note">입력된 캐릭터 3명 합계 · 부캐3은 미입력이라 제외</p><ul class="whl">'+deltas()+'</ul><div class="acts"><button class="btn gold">닫기</button></div></div>'}
document.getElementById('w').textContent=fm(last)+' G';chart(document.getElementById('sp'),S,26,1);document.getElementById('m').innerHTML=modal();chart(document.getElementById('ch'),S,220)</script>
