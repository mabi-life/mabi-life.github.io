# 토템 탭 미리보기용. 공식 NEXON Open API로 totem_pack.py 만 돌리고
# JSON을 artifact 로 올립니다. mabi-data 에는 쓰지 않습니다.
# workflow_dispatch 는 이 파일이 기본 브랜치에 있어야 동작하므로,
# 미리보기 중에는 pull_request(같은 저장소의 feat/auction-totem)로 실행합니다.
name: totem-preview-pack
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pack:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/auction-totem'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pack totem listings (official API only, no mabi-data write)
        run: python totem_pack.py
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - name: Upload preview JSON
        uses: actions/upload-artifact@v4
        with:
          name: totem-json
          path: |
            docs/auction/totem_data.json
            docs/auction/totem_history.json
          if-no-files-found: error
          retention-days: 7
