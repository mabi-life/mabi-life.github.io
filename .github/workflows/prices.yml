name: update-prices
on:
  # 실행 주기: 서비스 키(500 req/s, 2천만/일) → 10분마다.
  # list+history ≈ 아이템수×2×144 ≈ 5~6만/일 (20M 한도 여유).
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: prices, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python fetch_prices.py
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - run: python horn_beads.py || true
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json docs/history_roll.json docs/pyeollin_history.json docs/horn_beads.json
          git diff --cached --quiet || (git commit -m "prices: $(date -u +%FT%TZ)" && git pull --rebase && git push)
