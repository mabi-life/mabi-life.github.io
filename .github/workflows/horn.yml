name: update-horn
# 뿔피리 전용 경량 워크플로 (수십 초). GitHub 스케줄은 지연/누락이 잦아
# 정각(:00)을 피해 엇갈린 분에 등록. 외부 핑(cron-job.org 등)으로
# workflow_dispatch API를 호출하면 더 촘촘하게 돌릴 수 있음 (README 참고).
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: horn, cancel-in-progress: false}
jobs:
  horn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python horn_beads.py
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/horn_beads.json docs/horn_history.json
          git diff --cached --quiet && exit 0
          git commit -m "horn: $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
